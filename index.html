<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Regalos - Baby Shower</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f7fb; margin:0; padding:20px; }
    h1 { text-align:center; color:#5a4fcf; }
    .container { max-width:900px; margin:auto; }
    .gift { background:white; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 4px 10px rgba(0,0,0,0.08); }
    .gift h3 { margin-top:0; }
    .gift a { color:#5a4fcf; word-break:break-all; }
    .status { margin-top:8px; font-weight:bold; }
    button { padding:10px 14px; border:none; border-radius:8px; cursor:pointer; }
    .reserve { background:#5a4fcf; color:white; }
    .release { background:#ff6b6b; color:white; }
    .admin { background:#eaeafc; padding:16px; border-radius:12px; margin-bottom:24px; }
    input, textarea { width:100%; padding:8px; margin:6px 0; border-radius:6px; border:1px solid #ccc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>👶 Lista de Regalos Baby Shower</h1>

    <div class="admin">
      <h2>Agregar regalo (solo mamá/papá)</h2>
      <input id="name" placeholder="Nombre del regalo" />
      <textarea id="desc" placeholder="Descripción"></textarea>
      <input id="link" placeholder="Link de compra" />
      <button class="reserve" onclick="addGift()">Agregar</button>
    </div>

    <div id="giftList"></div>
  </div>

<script>
let gifts = JSON.parse(localStorage.getItem('gifts')) || [];

function save() {
  localStorage.setItem('gifts', JSON.stringify(gifts));
  render();
}

function addGift() {
  const name = document.getElementById('name').value;
  const desc = document.getElementById('desc').value;
  const link = document.getElementById('link').value;
  if(!name || !link) return alert('Completa al menos nombre y link');
  gifts.push({ name, desc, link, reserved:false });
  document.getElementById('name').value='';
  document.getElementById('desc').value='';
  document.getElementById('link').value='';
  save();
}

function toggleReserve(i) {
  gifts[i].reserved = !gifts[i].reserved;
  save();
}

function render() {
  const list = document.getElementById('giftList');
  list.innerHTML='';
  gifts.forEach((g,i)=>{
    const div = document.createElement('div');
    div.className='gift';
    div.innerHTML = `
      <h3>${g.name}</h3>
      <p>${g.desc || ''}</p>
      <a href="${g.link}" target="_blank">Ir a la tienda</a>
      <div class="status">Estado: ${g.reserved ? '🔒 Reservado' : '🟢 Disponible'}</div>
      <button class="${g.reserved ? 'release':'reserve'}" onclick="toggleReserve(${i})">
        ${g.reserved ? 'Liberar regalo' : 'Reservar regalo'}
      </button>
    `;
    list.appendChild(div);
  });
}

render();
</script>
</body>
</html>w
